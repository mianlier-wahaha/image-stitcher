[package]
name = "image-stitcher-tauri"
version = "1.0.0"
description = "本地图片拼接工具（Tauri 封装）"
edition = "2021"

[lib]
name = "image_stitcher_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "5"
