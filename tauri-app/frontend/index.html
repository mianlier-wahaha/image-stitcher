<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>图片拼接工具</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: rgba(255, 255, 255, 0.04);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #5b8cff;
    --accent-2: #7c5cff;
    --danger: #ff5c72;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 800px at 80% -10%, rgba(124,92,255,0.18), transparent 60%),
                radial-gradient(1000px 700px at -10% 110%, rgba(91,140,255,0.16), transparent 55%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 26px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--panel-border);
    backdrop-filter: blur(8px);
  }
  header h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: 0.3px; }
  header .tag {
    font-size: 12px; color: var(--muted);
    border: 1px solid var(--panel-border); padding: 3px 9px; border-radius: 999px;
  }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 18px;
    padding: 18px 22px 26px;
    min-height: 0;
  }
  .col { min-height: 0; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 16px;
  }
  .card h2 { font-size: 13px; margin: 0 0 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

  /* drop zone */
  .drop {
    border: 1.5px dashed var(--panel-border);
    border-radius: var(--radius);
    padding: 22px 14px;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: .18s border-color, .18s background;
    font-size: 13px;
  }
  .drop:hover, .drop.over { border-color: var(--accent); background: rgba(91,140,255,0.08); color: var(--text); }
  .drop b { color: var(--accent); }

  /* thumbs */
  .thumbs { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 320px; padding-right: 4px; }
  .thumb {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 8px;
    cursor: grab;
    transition: .15s border-color, .15s transform;
  }
  .thumb.dragging { opacity: .4; }
  .thumb.drag-over { border-color: var(--accent); }
  .thumb img { width: 46px; height: 46px; object-fit: cover; border-radius: 7px; background: #000; flex: 0 0 auto; }
  .thumb .meta { flex: 1; min-width: 0; }
  .thumb .name { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumb .size { font-size: 11px; color: var(--muted); }
  .thumb .del {
    border: none; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 16px; line-height: 1; padding: 4px 6px; border-radius: 8px;
  }
  .thumb .del:hover { color: var(--danger); background: rgba(255,92,114,0.12); }
  .empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 14px 0; }

  /* controls */
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .row:last-child { margin-bottom: 0; }
  .row label { font-size: 13px; color: var(--muted); min-width: 64px; }
  .seg { display: flex; gap: 6px; flex: 1; }
  .seg button {
    flex: 1; padding: 9px 0; border-radius: 10px; cursor: pointer;
    border: 1px solid var(--panel-border); background: rgba(255,255,255,0.03);
    color: var(--text); font-size: 13px; transition: .15s;
  }
  .seg button.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; font-weight: 600; }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  .val { font-size: 13px; color: var(--text); min-width: 40px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="color"] { width: 40px; height: 30px; border: 1px solid var(--panel-border); border-radius: 8px; background: none; cursor: pointer; padding: 2px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; }
  select {
    flex: 1; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,0.03);
    color: var(--text); border: 1px solid var(--panel-border); font-size: 13px;
  }
  .btn {
    border: none; border-radius: 11px; padding: 11px 14px; font-size: 13.5px; cursor: pointer;
    font-weight: 600; transition: .15s transform, .15s opacity;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; flex: 1; }
  .btn-ghost { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--panel-border); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 10px; margin-top: 4px; }

  /* preview */
  .preview-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .preview-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .preview-head .info { font-size: 12.5px; color: var(--muted); }
  .stage {
    flex: 1; min-height: 0; overflow: auto; border-radius: var(--radius);
    border: 1px solid var(--panel-border);
    background-color: #0a0c10;
    background-image:
      linear-gradient(45deg, #15181f 25%, transparent 25%),
      linear-gradient(-45deg, #15181f 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #15181f 75%),
      linear-gradient(-45deg, transparent 75%, #15181f 75%);
    background-size: 22px 22px;
    background-position: 0 0, 0 11px, 11px -11px, -11px 0;
    display: flex; align-items: center; justify-content: center; padding: 18px;
  }
  canvas { max-width: 100%; max-height: 100%; border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,0.45); }
  .hint { color: var(--muted); font-size: 13px; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 9px; }
</style>
</head>
<body>
  <header>
    <h1>图片拼接工具</h1>
  </header>

  <main>
    <!-- left column -->
    <section class="col">
      <div class="card">
        <h2>添加图片</h2>
        <div class="drop" id="drop">
          拖拽图片到此处，或 <b>点击选择</b><br />支持多选，按添加顺序拼接
        </div>
        <input type="file" id="file" accept="image/*" multiple hidden />
      </div>

      <div class="card" style="flex:1; display:flex; flex-direction:column; min-height:0;">
        <h2>图片列表（拖拽排序）</h2>
        <div class="thumbs" id="thumbs">
          <div class="empty">还没有图片</div>
        </div>
      </div>

      <div class="card">
        <h2>拼接设置</h2>
        <div class="row">
          <label>方向</label>
          <div class="seg" id="mode">
            <button data-mode="horizontal" class="active">横向</button>
            <button data-mode="vertical">竖向</button>
          </div>
        </div>
        <div class="row">
          <label>间距</label>
          <input type="range" id="gap" min="0" max="100" value="0" />
          <span class="val" id="gapVal">0px</span>
        </div>
        <div class="row">
          <label>背景</label>
          <input type="color" id="bg" value="#ffffff" />
          <label class="check"><input type="checkbox" id="transparent" /> 透明背景</label>
        </div>
        <div class="row">
          <label>对齐</label>
          <label class="check"><input type="checkbox" id="align" checked /> 等比缩放统一尺寸</label>
        </div>
        <div class="row">
          <label>导出格式</label>
          <select id="format">
            <option value="png">PNG（无损 / 支持透明）</option>
            <option value="jpg">JPG（体积更小）</option>
          </select>
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="export" disabled>导出拼接图</button>
          <button class="btn btn-ghost" id="clear" disabled>清空</button>
        </div>
      </div>
    </section>

    <!-- right column -->
    <section class="col preview-wrap">
      <div class="preview-head">
        <h2 style="margin:0; color:var(--muted); font-size:13px; letter-spacing:1px;">预览</h2>
        <span class="info" id="info">未生成</span>
      </div>
      <div class="stage" id="stage">
        <span class="hint">添加图片后将在此实时预览拼接效果</span>
      </div>
    </section>
  </main>

<script>
(function () {
  "use strict";

  var state = {
    images: [], // { el, name, w, h, url }
    mode: "horizontal",
    gap: 0,
    bg: "#ffffff",
    transparent: false,
    align: true,
    format: "png"
  };

  var canvas = document.createElement("canvas");
  var ctx = canvas.getContext("2d");

  var drop = document.getElementById("drop");
  var fileInput = document.getElementById("file");
  var thumbsEl = document.getElementById("thumbs");
  var stage = document.getElementById("stage");
  var infoEl = document.getElementById("info");
  var exportBtn = document.getElementById("export");
  var clearBtn = document.getElementById("clear");

  // ---- add images ----
  function handleFiles(fileList) {
    var files = Array.prototype.slice.call(fileList).filter(function (f) {
      return f.type.indexOf("image/") === 0;
    });
    if (!files.length) return;
    var pending = files.length;
    files.forEach(function (file) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        state.images.push({
          el: img, name: file.name,
          w: img.naturalWidth, h: img.naturalHeight, url: url
        });
        if (--pending === 0) { renderThumbs(); updatePreview(); };
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        if (--pending === 0) { renderThumbs(); updatePreview(); };
      };
      img.src = url;
    });
  }

  drop.addEventListener("click", function () { fileInput.click(); });
  fileInput.addEventListener("change", function (e) {
    handleFiles(e.target.files);
    fileInput.value = "";
  });
  ["dragenter", "dragover"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); });
  });
  drop.addEventListener("drop", function (e) {
    if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
  });
  // allow dropping anywhere on the page
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files && e.target !== drop) handleFiles(e.dataTransfer.files);
  });

  // ---- thumbnails with drag-to-reorder ----
  var dragIndex = null;
  function renderThumbs() {
    thumbsEl.innerHTML = "";
    if (!state.images.length) {
      thumbsEl.innerHTML = '<div class="empty">还没有图片</div>';
      return;
    }
    state.images.forEach(function (item, i) {
      var div = document.createElement("div");
      div.className = "thumb";
      div.draggable = true;
      div.dataset.index = i;

      var im = document.createElement("img");
      im.src = item.url;

      var meta = document.createElement("div");
      meta.className = "meta";
      var nm = document.createElement("div");
      nm.className = "name";
      nm.textContent = item.name;
      var sz = document.createElement("div");
      sz.className = "size";
      sz.textContent = item.w + " × " + item.h;
      meta.appendChild(nm); meta.appendChild(sz);

      var del = document.createElement("button");
      del.className = "del";
      del.title = "删除";
      del.textContent = "×";
      del.addEventListener("click", function (e) {
        e.stopPropagation();
        URL.revokeObjectURL(item.url);
        state.images.splice(i, 1);
        renderThumbs(); updatePreview();
      });

      div.appendChild(im); div.appendChild(meta); div.appendChild(del);

      div.addEventListener("dragstart", function () { dragIndex = i; div.classList.add("dragging"); });
      div.addEventListener("dragend", function () { dragIndex = null; div.classList.remove("dragging"); });
      div.addEventListener("dragover", function (e) { e.preventDefault(); div.classList.add("drag-over"); });
      div.addEventListener("dragleave", function () { div.classList.remove("drag-over"); });
      div.addEventListener("drop", function (e) {
        e.preventDefault(); div.classList.remove("drag-over");
        var target = i;
        if (dragIndex === null || dragIndex === target) return;
        var moved = state.images.splice(dragIndex, 1)[0];
        state.images.splice(target, 0, moved);
        renderThumbs(); updatePreview();
      });

      thumbsEl.appendChild(div);
    });
  }

  // ---- preview / stitch ----
  function computeLayout() {
    var imgs = state.images;
    var gap = state.gap;
    var n = imgs.length;
    var draws = [];
    var W = 0, H = 0;

    if (state.mode === "horizontal") {
      var baseH = state.align ? Math.max.apply(null, imgs.map(function (i) { return i.h; })) : 0;
      var totalW = 0;
      draws = imgs.map(function (i) {
        var dw, dh;
        if (state.align) { dh = baseH; dw = i.w * (baseH / i.h); }
        else { dh = i.h; dw = i.w; }
        totalW += dw;
        return { el: i.el, dw: dw, dh: dh, dx: 0, dy: 0 };
      });
      totalW += gap * (n - 1);
      W = Math.round(totalW);
      H = state.align ? Math.round(baseH) : Math.round(Math.max.apply(null, imgs.map(function (i) { return i.h; })));
      var x = 0;
      draws.forEach(function (d) { d.dx = Math.round(x); d.dy = 0; x += d.dw + gap; });
    } else {
      var baseW = state.align ? Math.max.apply(null, imgs.map(function (i) { return i.w; })) : 0;
      var totalH = 0;
      draws = imgs.map(function (i) {
        var dw, dh;
        if (state.align) { dw = baseW; dh = i.h * (baseW / i.w); }
        else { dw = i.w; dh = i.h; }
        totalH += dh;
        return { el: i.el, dw: dw, dh: dh, dx: 0, dy: 0 };
      });
      totalH += gap * (n - 1);
      W = state.align ? Math.round(baseW) : Math.round(Math.max.apply(null, imgs.map(function (i) { return i.w; })));
      H = Math.round(totalH);
      var y = 0;
      draws.forEach(function (d) { d.dx = 0; d.dy = Math.round(y); y += d.dh + gap; });
    }
    return { W: W, H: H, draws: draws };
  }

  function updatePreview() {
    var has = state.images.length > 0;
    exportBtn.disabled = !has;
    clearBtn.disabled = !has;
    if (!has) {
      stage.innerHTML = '<span class="hint">添加图片后将在此实时预览拼接效果</span>';
      infoEl.textContent = "未生成";
      return;
    }
    var lay = computeLayout();
    canvas.width = lay.W;
    canvas.height = lay.H;
    ctx.clearRect(0, 0, lay.W, lay.H);
    if (!state.transparent) {
      ctx.fillStyle = state.bg;
      ctx.fillRect(0, 0, lay.W, lay.H);
    }
    lay.draws.forEach(function (d) {
      ctx.drawImage(d.el, d.dx, d.dy, d.dw, d.dh);
    });

    // refresh stage (keep checkerboard)
    stage.innerHTML = "";
    stage.appendChild(canvas);
    infoEl.textContent = lay.W + " × " + lay.H + " px · " + state.images.length + " 张";
  }

  // ---- controls ----
  document.getElementById("mode").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    state.mode = b.dataset.mode;
    Array.prototype.forEach.call(this.children, function (c) { c.classList.remove("active"); });
    b.classList.add("active");
    updatePreview();
  });
  var gapInput = document.getElementById("gap");
  var gapVal = document.getElementById("gapVal");
  gapInput.addEventListener("input", function () {
    state.gap = parseInt(gapInput.value, 10);
    gapVal.textContent = state.gap + "px";
    updatePreview();
  });
  document.getElementById("bg").addEventListener("input", function (e) {
    state.bg = e.target.value; updatePreview();
  });
  document.getElementById("transparent").addEventListener("change", function (e) {
    state.transparent = e.target.checked; updatePreview();
  });
  document.getElementById("align").addEventListener("change", function (e) {
    state.align = e.target.checked; updatePreview();
  });
  document.getElementById("format").addEventListener("change", function (e) {
    state.format = e.target.value;
  });

  // ---- export ----
  exportBtn.addEventListener("click", function () {
    if (!state.images.length) return;
    var lay = computeLayout();
    var out = document.createElement("canvas");
    out.width = lay.W; out.height = lay.H;
    var octx = out.getContext("2d");
    if (state.format === "jpg" || !state.transparent) {
      octx.fillStyle = state.bg;
      octx.fillRect(0, 0, lay.W, lay.H);
    }
    lay.draws.forEach(function (d) {
      octx.drawImage(d.el, d.dx, d.dy, d.dw, d.dh);
    });
    var mime = state.format === "png" ? "image/png" : "image/jpeg";
    var ext = state.format === "png" ? "png" : "jpg";
    var filename = "拼接图-" + Date.now() + "." + ext;
    // 二进制转 base64（供 Tauri 命令传参）
    function bufToBase64(bytes) {
      var binary = "";
      var chunk = 0x8000;
      for (var i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    out.toBlob(async function (blob) {
      if (!blob) return;
      var buf = await blob.arrayBuffer();
      var bytes = new Uint8Array(buf);
      try {
        // 1) Tauri：JS 侧用官方 dialog 插件弹系统“保存”对话框（可选目录+改文件名，默认桌面），再交 Rust 写盘
        var T = window.__TAURI__;
        var invoke = (T && T.tauri && T.tauri.invoke) || (T && T.core && T.core.invoke);
        if (T && T.dialog && T.dialog.save && invoke) {
          var d = new Date();
          function pad(n){ return (n < 10 ? "0" : "") + n; }
          var ts = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + "-" + pad(d.getHours()) + "-" + pad(d.getMinutes()) + "-" + pad(d.getSeconds());
          var defaultName = "拼接图-" + ts + "." + ext;
          var desk = null;
          try { desk = await invoke("desktop_dir"); } catch (e) { desk = null; }
          var defaultPath = (desk ? desk + "/" : "") + defaultName;
          var savePath = await T.dialog.save({
            title: "导出拼接图",
            defaultPath: defaultPath,
            filters: [{ name: "图片文件", extensions: [ext] }]
          });
          if (!savePath) { infoEl.textContent = "已取消导出"; return; }
          var b64 = bufToBase64(bytes);
          await invoke("export_image", { data: b64, path: savePath });
          infoEl.textContent = "已导出：" + savePath;
          return;
        }
        // 2) Electron：preload 桥接
        if (window.stitchApi && window.stitchApi.exportImage) {
          var saved2 = await window.stitchApi.exportImage(bytes, ext);
          if (!saved2) { infoEl.textContent = "已取消导出"; return; }
          infoEl.textContent = "已导出：" + saved2;
          return;
        }
        // 3) 浏览器：直接下载
        var a = document.createElement("a");
        a.download = filename;
        a.href = URL.createObjectURL(blob);
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      } catch (err) {
        alert("导出失败：" + ((err && err.message) ? err.message : err));
      }
    }, mime, 0.92);
  });

  clearBtn.addEventListener("click", function () {
    state.images.forEach(function (i) { URL.revokeObjectURL(i.url); });
    state.images = [];
    renderThumbs(); updatePreview();
  });

  // initial
  renderThumbs();
  updatePreview();
})();
</script>
</body>
</html>
