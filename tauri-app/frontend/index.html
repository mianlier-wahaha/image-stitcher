<head data-page-node-id="93xcVPySf4Bqeo1CUyaqKb">

<title>图片拼接工具</title>
<style>
  :root {
    --bg: #0e1116;
    --panel: rgba(255, 255, 255, 0.04);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #5b8cff;
    --accent-2: #7c5cff;
    --danger: #ff5c72;
    --radius: 14px;
  }
  .mask {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 60;
    background: rgba(6, 8, 12, 0.72);
    display: flex; align-items: center; justify-content: center;
  }
  .modal {
    width: 430px; max-width: calc(100% - 40px);
    background: #151a22;
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 20px 22px;
  }
  .modal h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
  .modal p { margin: 0 0 14px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  .modal input[type="text"] {
    width: 100%; padding: 9px 11px; font-size: 13px; font-family: inherit;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--panel-border);
    border-radius: 9px; color: var(--text); outline: none;
  }
  .modal input[type="text"]:focus { border-color: var(--accent); }
  .modal .acts { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal .acts button { padding: 8px 16px; font-size: 13px; font-family: inherit; border-radius: 9px; cursor: pointer; }
  .modal .acts .cancel { background: transparent; border: 1px solid var(--panel-border); color: var(--muted); }
  .modal .acts .ok { background: var(--accent); border: none; color: #fff; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: radial-gradient(1200px 800px at 80% -10%, rgba(124,92,255,0.18), transparent 60%),
                radial-gradient(1000px 700px at -10% 110%, rgba(91,140,255,0.16), transparent 55%),
                var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 14px;
    padding: 14px 18px 18px;
    min-height: 0;
  }
  .col { min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: var(--radius);
    padding: 12px 13px;
  }
  .card h2 { font-size: 12px; margin: 0 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

  /* list card head: 标题 + 添加按钮 */
  .list-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 10px;
  }
  .list-head h2 { margin: 0; }
  .btn-add {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 6px 11px; font-size: 12.5px; border-radius: 8px; cursor: pointer;
    border: 1px dashed var(--panel-border); background: rgba(255,255,255,0.03); color: var(--text);
    transition: .15s; font-family: inherit;
  }
  .btn-add:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }
  .card.drag-over { border-color: var(--accent); border-style: dashed; background: rgba(91,140,255,0.06); }

  /* 紧凑设置卡：去掉冗余空白 */
  .card.compact { padding: 11px 13px; }
  .settings { display: flex; flex-direction: column; gap: 6px; }

  /* thumbs: 不再用 max-height，由父卡片 flex:1 自然撑满 */
  .thumbs { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; }
  .thumb {
    display: flex; align-items: center; gap: 9px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--panel-border);
    border-radius: 9px;
    padding: 7px;
    cursor: grab;
    transition: .15s border-color, .15s transform;
  }
  .thumb.dragging { opacity: .4; }
  .thumb.drag-over { border-color: var(--accent); }
  .thumb img { width: 42px; height: 42px; object-fit: cover; border-radius: 6px; background: #000; flex: 0 0 auto; }
  .thumb .meta { flex: 1; min-width: 0; }
  .thumb .name { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumb .size { font-size: 11px; color: var(--muted); }
  .thumb .del {
    border: none; background: transparent; color: var(--muted);
    cursor: pointer; font-size: 16px; line-height: 1; padding: 4px 6px; border-radius: 8px;
  }
  .thumb .del:hover { color: var(--danger); background: rgba(255,92,114,0.12); }
  .empty { color: var(--muted); font-size: 12.5px; text-align: center; padding: 14px 0; }

  /* controls */
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12.5px; color: var(--muted); min-width: 50px; }
  .seg { display: flex; gap: 5px; flex: 1; }
  .seg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .seg button {
    flex: 1; padding: 7px 0; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--panel-border); background: rgba(255,255,255,0.03);
    color: var(--text); font-size: 12.5px; transition: .15s;
  }
  .seg button.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); border-color: transparent; color: #fff; font-weight: 600; }
  input[type="range"] { flex: 1; accent-color: var(--accent); }
  .val { font-size: 12.5px; color: var(--text); min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type="color"] { width: 34px; height: 26px; border: 1px solid var(--panel-border); border-radius: 7px; background: none; cursor: pointer; padding: 2px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text); cursor: pointer; }
  select {
    flex: 1; padding: 7px 9px; border-radius: 8px; background: rgba(255,255,255,0.03);
    color: var(--text); border: 1px solid var(--panel-border); font-size: 12.5px;
  }
  .btn {
    border: none; border-radius: 10px; padding: 10px 14px; font-size: 13.5px; cursor: pointer;
    font-weight: 600; transition: .15s transform, .15s opacity;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; flex: 1; }
  .btn-ghost { background: rgba(255,255,255,0.05); color: var(--text); border: 1px solid var(--panel-border); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-row { display: flex; gap: 8px; margin-top: 6px; }

  /* preview */
  .preview-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .preview-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .preview-head .info { font-size: 12.5px; color: var(--muted); }
  .stage {
    flex: 1; min-height: 0; overflow: auto; border-radius: var(--radius);
    border: 1px solid var(--panel-border);
    background-color: #0a0c10;
    background-image:
      linear-gradient(45deg, #15181f 25%, transparent 25%),
      linear-gradient(-45deg, #15181f 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #15181f 75%),
      linear-gradient(-45deg, transparent 75%, #15181f 75%);
    background-size: 22px 22px;
    background-position: 0 0, 0 11px, 11px -11px, -11px 0;
    display: flex; align-items: center; justify-content: center; padding: 18px;
  }
  canvas { max-width: 100%; max-height: 100%; border-radius: 4px; box-shadow: 0 8px 30px rgba(0,0,0,0.45); }
  .hint { color: var(--muted); font-size: 13px; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 9px; }
</style>

      <div class="card" id="listCard" style="flex:1; display:flex; flex-direction:column; min-height:0;" data-page-node-id="pgWRDm6F9c8krx4r50D6Vr">

<script>
(function () {
  "use strict";

  var state = {
    images: [], // { el, name, w, h, url }
    mode: "horizontal",
    gap: 0,
    bg: "#ffffff",
    transparent: false,
    align: true,
    format: "png"
  };

  var canvas = document.createElement("canvas");
  var ctx = canvas.getContext("2d");

  var fileInput = document.getElementById("file");
  var thumbsEl = document.getElementById("thumbs");
  var stage = document.getElementById("stage");
  var infoEl = document.getElementById("info");
  var exportBtn = document.getElementById("export");
  var clearBtn = document.getElementById("clear");
  var addBtn = document.getElementById("addBtn");
  var listCard = document.getElementById("listCard");

  // ---- add images ----
  function handleFiles(fileList) {
    var files = Array.prototype.slice.call(fileList).filter(function (f) {
      return f.type.indexOf("image/") === 0;
    });
    if (!files.length) return;
    var pending = files.length;
    files.forEach(function (file) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        state.images.push({
          el: img, name: file.name,
          w: img.naturalWidth, h: img.naturalHeight, url: url
        });
        if (--pending === 0) { renderThumbs(); updatePreview(); };
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        if (--pending === 0) { renderThumbs(); updatePreview(); };
      };
      img.src = url;
    });
  }

  addBtn.addEventListener("click", function () { fileInput.click(); });
  // 文件选择后清空 value，便于重复选同一文件
  fileInput.addEventListener("change", function (e) {
    handleFiles(e.target.files);
    fileInput.value = "";
  });
  // 拖拽接收：从外部拖图片到列表卡（替代原来的 drop 框）
  ["dragenter", "dragover"].forEach(function (ev) {
    listCard.addEventListener(ev, function (e) {
      e.preventDefault();
      listCard.classList.add("drag-over");
    });
  });
  ["dragleave", "drop"].forEach(function (ev) {
    listCard.addEventListener(ev, function (e) {
      e.preventDefault();
      listCard.classList.remove("drag-over");
    });
  });
  listCard.addEventListener("drop", function (e) {
    if (e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
  });
  // 兜底：拖到页面任何位置都接收
  window.addEventListener("dragover", function (e) { e.preventDefault(); });
  window.addEventListener("drop", function (e) {
    e.preventDefault();
    if (e.dataTransfer && e.dataTransfer.files && e.target !== listCard && !listCard.contains(e.target)) {
      handleFiles(e.dataTransfer.files);
    }
  });

  // ---- thumbnails with drag-to-reorder ----
  var dragIndex = null;
  function renderThumbs() {
    thumbsEl.innerHTML = "";
    if (!state.images.length) {
      thumbsEl.innerHTML = '<div class="empty">还没有图片</div>';
      return;
    }
    state.images.forEach(function (item, i) {
      var div = document.createElement("div");
      div.className = "thumb";
      div.draggable = true;
      div.dataset.index = i;

      var im = document.createElement("img");
      im.src = item.url;

      var meta = document.createElement("div");
      meta.className = "meta";
      var nm = document.createElement("div");
      nm.className = "name";
      nm.textContent = item.name;
      var sz = document.createElement("div");
      sz.className = "size";
      sz.textContent = item.w + " × " + item.h;
      meta.appendChild(nm); meta.appendChild(sz);

      var del = document.createElement("button");
      del.className = "del";
      del.title = "删除";
      del.textContent = "×";
      del.addEventListener("click", function (e) {
        e.stopPropagation();
        URL.revokeObjectURL(item.url);
        state.images.splice(i, 1);
        renderThumbs(); updatePreview();
      });

      div.appendChild(im); div.appendChild(meta); div.appendChild(del);

      div.addEventListener("dragstart", function () { dragIndex = i; div.classList.add("dragging"); });
      div.addEventListener("dragend", function () { dragIndex = null; div.classList.remove("dragging"); });
      div.addEventListener("dragover", function (e) { e.preventDefault(); div.classList.add("drag-over"); });
      div.addEventListener("dragleave", function () { div.classList.remove("drag-over"); });
      div.addEventListener("drop", function (e) {
        e.preventDefault(); div.classList.remove("drag-over");
        var target = i;
        if (dragIndex === null || dragIndex === target) return;
        var moved = state.images.splice(dragIndex, 1)[0];
        state.images.splice(target, 0, moved);
        renderThumbs(); updatePreview();
      });

      thumbsEl.appendChild(div);
    });
  }

  // ---- preview / stitch ----
  function computeLayout() {
    var imgs = state.images;
    var gap = state.gap;
    var n = imgs.length;
    var draws = [];
    var W = 0, H = 0;

    if (state.mode === "horizontal") {
      var baseH = state.align ? Math.max.apply(null, imgs.map(function (i) { return i.h; })) : 0;
      var totalW = 0;
      draws = imgs.map(function (i) {
        var dw, dh;
        if (state.align) { dh = baseH; dw = i.w * (baseH / i.h); }
        else { dh = i.h; dw = i.w; }
        totalW += dw;
        return { el: i.el, dw: dw, dh: dh, dx: 0, dy: 0 };
      });
      totalW += gap * (n - 1);
      W = Math.round(totalW);
      H = state.align ? Math.round(baseH) : Math.round(Math.max.apply(null, imgs.map(function (i) { return i.h; })));
      var x = 0;
      draws.forEach(function (d) { d.dx = Math.round(x); d.dy = 0; x += d.dw + gap; });
    } else if (state.mode === "grid2" || state.mode === "grid3") {
      // 网格：cols 列，rows 行；图片多于格子数自动加行，不足则末行留空
      var cols = state.mode === "grid2" ? 2 : 3;
      var rows = Math.ceil(n / cols);
      var cellW = Math.max.apply(null, imgs.map(function (i) { return i.w; }));
      var cellH = Math.max.apply(null, imgs.map(function (i) { return i.h; }));
      W = Math.round(cols * cellW + gap * (cols - 1));
      H = Math.round(rows * cellH + gap * (rows - 1));
      draws = imgs.map(function (i, idx) {
        var r = Math.floor(idx / cols), c = idx % cols;
        var cellX = c * (cellW + gap), cellY = r * (cellH + gap);
        var scale = state.align
          ? Math.max(cellW / i.w, cellH / i.h)   // 填满格子（多余部分裁掉）
          : Math.min(cellW / i.w, cellH / i.h);  // 完整显示（留白由背景色填充）
        var dw = i.w * scale, dh = i.h * scale;
        return {
          el: i.el, dw: dw, dh: dh,
          dx: cellX + (cellW - dw) / 2,
          dy: cellY + (cellH - dh) / 2,
          clip: { x: cellX, y: cellY, w: cellW, h: cellH }
        };
      });
    } else {
      var baseW = state.align ? Math.max.apply(null, imgs.map(function (i) { return i.w; })) : 0;
      var totalH = 0;
      draws = imgs.map(function (i) {
        var dw, dh;
        if (state.align) { dw = baseW; dh = i.h * (baseW / i.w); }
        else { dw = i.w; dh = i.h; }
        totalH += dh;
        return { el: i.el, dw: dw, dh: dh, dx: 0, dy: 0 };
      });
      totalH += gap * (n - 1);
      W = state.align ? Math.round(baseW) : Math.round(Math.max.apply(null, imgs.map(function (i) { return i.w; })));
      H = Math.round(totalH);
      var y = 0;
      draws.forEach(function (d) { d.dx = 0; d.dy = Math.round(y); y += d.dh + gap; });
    }
    return { W: W, H: H, draws: draws };
  }

  // 统一绘制入口：网格模式下图片可能溢出格子，需按格子做 clip 裁剪
  function paint(target, lay, forceBg) {
    target.clearRect(0, 0, lay.W, lay.H);
    if (forceBg || !state.transparent) {
      target.fillStyle = state.bg;
      target.fillRect(0, 0, lay.W, lay.H);
    }
    lay.draws.forEach(function (d) {
      if (d.clip) {
        target.save();
        target.beginPath();
        target.rect(d.clip.x, d.clip.y, d.clip.w, d.clip.h);
        target.clip();
        target.drawImage(d.el, d.dx, d.dy, d.dw, d.dh);
        target.restore();
      } else {
        target.drawImage(d.el, d.dx, d.dy, d.dw, d.dh);
      }
    });
  }

  // 浏览器 canvas 有尺寸上限，超出后绘制与 toBlob 会静默失败（预览全白、导出点不动）
  var MAX_DIM = 16384, MAX_AREA = 100000000;
  function fitLayout(lay) {
    var area = lay.W * lay.H;
    if (lay.W <= MAX_DIM && lay.H <= MAX_DIM && area <= MAX_AREA) return { lay: lay, scaled: false };
    // 留 2% 余量并用 floor 取整：两边各自取整后乘积会略微回弹，否则仍可能刚好超限
    var s = Math.min(MAX_DIM / lay.W, MAX_DIM / lay.H, Math.sqrt(MAX_AREA * 0.98 / area));
    return {
      lay: {
        W: Math.max(1, Math.floor(lay.W * s)),
        H: Math.max(1, Math.floor(lay.H * s)),
        draws: lay.draws.map(function (d) {
          var nd = { el: d.el, dw: d.dw * s, dh: d.dh * s, dx: d.dx * s, dy: d.dy * s };
          if (d.clip) nd.clip = { x: d.clip.x * s, y: d.clip.y * s, w: d.clip.w * s, h: d.clip.h * s };
          return nd;
        })
      },
      scaled: true
    };
  }

  function updatePreview() {
    var has = state.images.length > 0;
    exportBtn.disabled = !has;
    clearBtn.disabled = !has;
    if (!has) {
      stage.innerHTML = '<span class="hint">添加图片后将在此实时预览拼接效果</span>';
      infoEl.textContent = "未生成";
      return;
    }
    var fit = fitLayout(computeLayout());
    var lay = fit.lay;
    canvas.width = lay.W;
    canvas.height = lay.H;
    paint(ctx, lay, false);

    // refresh stage (keep checkerboard)
    stage.innerHTML = "";
    stage.appendChild(canvas);
    var desc = "";
    if (state.mode === "grid2" || state.mode === "grid3") {
      var gc = state.mode === "grid2" ? 2 : 3;
      desc = gc + " × " + Math.ceil(state.images.length / gc) + " 网格 · ";
    }
    infoEl.textContent = desc + lay.W + " × " + lay.H + " px · " + state.images.length + " 张" + (fit.scaled ? "（超出画布上限，已等比缩小）" : "");
  }

  // ---- controls ----
  // 缩放开关在网格模式下语义不同：控制「填满格子(裁切)」还是「完整显示(留白)」
  function updateAlignLabel() {
    var isGrid = state.mode === "grid2" || state.mode === "grid3";
    document.getElementById("alignLabel").textContent =
      isGrid ? "填满格子（裁切多余）" : "等比缩放统一尺寸";
  }

  document.getElementById("mode").addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    state.mode = b.dataset.mode;
    Array.prototype.forEach.call(this.children, function (c) { c.classList.remove("active"); });
    b.classList.add("active");
    updateAlignLabel();
    updatePreview();
  });
  var gapInput = document.getElementById("gap");
  var gapVal = document.getElementById("gapVal");
  gapInput.addEventListener("input", function () {
    state.gap = parseInt(gapInput.value, 10);
    gapVal.textContent = state.gap + "px";
    updatePreview();
  });
  document.getElementById("bg").addEventListener("input", function (e) {
    state.bg = e.target.value; updatePreview();
  });
  document.getElementById("transparent").addEventListener("change", function (e) {
    state.transparent = e.target.checked; updatePreview();
  });
  document.getElementById("align").addEventListener("change", function (e) {
    state.align = e.target.checked; updatePreview();
  });
  document.getElementById("format").addEventListener("change", function (e) {
    state.format = e.target.value;
  });

  // ---- 保存相关辅助 ----
  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function stamp() {
    var d = new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) +
      "-" + pad2(d.getHours()) + "-" + pad2(d.getMinutes()) + "-" + pad2(d.getSeconds());
  }

  // 把拼接结果直接显示在预览区（浏览器环境无法保证下载成功时的兜底反馈）
  function showResult(url, lay) {
    var wrap = document.createElement("div");
    wrap.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px;";
    var img = document.createElement("img");
    img.src = url;
    img.style.cssText = "max-width:100%;max-height:68vh;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,0.45);";
    var tip = document.createElement("div");
    tip.style.cssText = "font-size:13px;color:var(--muted);text-align:center;line-height:1.6;";
    tip.textContent = "拼接结果（" + lay.W + " × " + lay.H + " px）。若未自动保存，可右键图片另存。";
    wrap.appendChild(img);
    wrap.appendChild(tip);
    stage.innerHTML = "";
    stage.appendChild(wrap);
  }

  // 自定义命名弹窗：无系统保存对话框时的兜底（可改文件名，目录由环境决定）
  function askSaveName(defaultName, note) {
    return new Promise(function (resolve) {
      var mask = document.createElement("div");
      mask.className = "mask";
      var box = document.createElement("div");
      box.className = "modal";
      var h = document.createElement("h3");
      h.textContent = "保存拼接图";
      var p = document.createElement("p");
      p.textContent = note || "请确认文件名，完成后将保存到默认下载文件夹。";
      var input = document.createElement("input");
      input.type = "text";
      input.value = defaultName;
      var acts = document.createElement("div");
      acts.className = "acts";
      var cancel = document.createElement("button");
      cancel.className = "cancel"; cancel.textContent = "取消";
      var ok = document.createElement("button");
      ok.className = "ok"; ok.textContent = "保存";
      acts.appendChild(cancel);
      acts.appendChild(ok);
      box.appendChild(h); box.appendChild(p); box.appendChild(input); box.appendChild(acts);
      mask.appendChild(box);
      document.body.appendChild(mask);

      var done = false;
      function clean(v) {
        var s = String(v || "").replace(/[\\/:*?"<>|]/g, "").trim();
        return s || defaultName;
      }
      function finish(v) {
        if (done) return;
        done = true;
        document.removeEventListener("keydown", onKey);
        if (mask.parentNode) mask.parentNode.removeChild(mask);
        resolve(v);
      }
      function onKey(e) {
        if (e.key === "Escape") finish(null);
        else if (e.key === "Enter") finish(clean(input.value));
      }
      cancel.addEventListener("click", function () { finish(null); });
      ok.addEventListener("click", function () { finish(clean(input.value)); });
      mask.addEventListener("click", function (e) { if (e.target === mask) finish(null); });
      document.addEventListener("keydown", onKey);
      setTimeout(function () { input.focus(); input.select(); }, 0);
    });
  }

  // ---- export ----
  exportBtn.addEventListener("click", async function () {
    if (!state.images.length) return;

    // 浏览器环境：必须趁用户点击的“瞬时激活”还在，同步发起系统保存窗口请求，
    // 否则等到 toBlob 异步回调里再调会被浏览器以“缺少用户手势”为由拒绝。
    var fsHandle = null;
    if (!window.__TAURI__ && typeof window.showSaveFilePicker === "function") {
      var extNow = state.format === "png" ? "png" : "jpg";
      try {
        fsHandle = await window.showSaveFilePicker({
          suggestedName: "拼接图-" + stamp() + "." + extNow,
          startIn: "downloads",
          types: [{
            description: "图片文件",
            accept: extNow === "png" ? { "image/png": [".png"] } : { "image/jpeg": [".jpg", ".jpeg"] }
          }]
        });
      } catch (e) {
        if (e && e.name === "AbortError") { infoEl.textContent = "已取消导出"; return; }
        fsHandle = null; // 非取消类错误（如非安全上下文）则回退到自定义弹窗
      }
    }

    var fit = fitLayout(computeLayout());
    var lay = fit.lay;
    infoEl.textContent = "正在导出…";
    var out = document.createElement("canvas");
    out.width = lay.W; out.height = lay.H;
    try {
      paint(out.getContext("2d"), lay, state.format === "jpg");
    } catch (err) {
      alert("绘制失败：" + ((err && err.message) ? err.message : err));
      infoEl.textContent = "导出失败";
      return;
    }
    var mime = state.format === "png" ? "image/png" : "image/jpeg";
    var ext = state.format === "png" ? "png" : "jpg";
    var filename = "拼接图-" + Date.now() + "." + ext;
    // 二进制转 base64（供 Tauri 命令传参）
    function bufToBase64(bytes) {
      var binary = "";
      var chunk = 0x8000;
      for (var i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    out.toBlob(async function (blob) {
      if (!blob) {
        alert("导出失败：画布超出浏览器上限（" + lay.W + " × " + lay.H + "）。请减少图片数量、缩小间距，或改用横向/竖向拼接。");
        infoEl.textContent = "导出失败";
        return;
      }
      var buf = await blob.arrayBuffer();
      var bytes = new Uint8Array(buf);
      try {
        // 1) Tauri：系统“保存”对话框（可选目录 + 改文件名，默认打开「下载」文件夹），再交 Rust 写盘
        var T = window.__TAURI__;
        var invoke = (T && T.tauri && T.tauri.invoke) || (T && T.core && T.core.invoke);
        if (T && invoke) {
          var defaultName = "拼接图-" + stamp() + "." + ext;
          var dir = null;
          try { dir = await invoke("downloads_dir"); } catch (e) { dir = null; }
          var savePath = null;
          if (T.dialog && T.dialog.save) {
            savePath = await T.dialog.save({
              title: "导出拼接图",
              defaultPath: (dir ? dir + "/" : "") + defaultName,
              filters: [{ name: "图片文件", extensions: [ext] }]
            });
          } else {
            var nm = await askSaveName(defaultName,
              "未检测到系统保存对话框，文件将保存到「下载」文件夹。可修改文件名后保存。");
            if (nm) savePath = (dir ? dir + "/" : "") + nm;
          }
          if (!savePath) { infoEl.textContent = "已取消导出"; return; }
          await invoke("export_image", { data: bufToBase64(bytes), path: savePath });
          infoEl.textContent = "已导出：" + savePath;
          return;
        }
        // 2) 浏览器：若点击时已拿到系统保存窗口句柄，直接写入用户选择的目录
        var url = URL.createObjectURL(blob);
        if (fsHandle) {
          try {
            var w = await fsHandle.createWritable();
            await w.write(blob);
            await w.close();
            infoEl.textContent = "已导出：" + (fsHandle.name || filename);
            setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
            return;
          } catch (e) {
            if (e && e.name === "AbortError") { infoEl.textContent = "已取消导出"; return; }
          }
        }
        // 3) 兜底：自定义命名弹窗 + 浏览器下载（目录由浏览器决定，通常即「下载」文件夹）
        var typed = await askSaveName(filename,
          "当前环境不支持选择保存目录，文件将保存到浏览器的默认下载文件夹。可修改文件名。");
        if (!typed) { infoEl.textContent = "已取消导出"; return; }
        var a = document.createElement("a");
        a.download = typed;
        a.href = url;
        a.rel = "noopener";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showResult(url, lay);
        infoEl.textContent = "已导出：" + typed;
        setTimeout(function () { URL.revokeObjectURL(url); }, 120000);
      } catch (err) {
        alert("导出失败：" + ((err && err.message) ? err.message : err));
      }
    }, mime, 0.92);
  });

  clearBtn.addEventListener("click", function () {
    state.images.forEach(function (i) { URL.revokeObjectURL(i.url); });
    state.images = [];
    renderThumbs(); updatePreview();
  });

  // initial
  renderThumbs();
  updatePreview();
})();
</script>
</body>
</html>
